# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: TURNS_PER_ROUND
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/enemy-system.md
      - design/gdd/timing-combat-system.md
    variables:
      - SPD_c           # acting combatant's SPD stat (1–99)
      - SPD_min         # lowest SPD among all active combatants (1–99)
      - SWIFT_THRESHOLD # tunable float, default 1.5
    output_range: [1, 2]
    expression: "min(2, 1 + floor(SPD_c / (SPD_min × SWIFT_THRESHOLD)))"
    notes: "Locked at round start — does not recalculate mid-round. Feeds into
      Timing Combat System turn order and HUD turn strip."
    added: "2026-04-22"
    revised: ""

  - name: TIMING_WINDOW_FRAMES
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/input-and-timing-detection.md
      - design/gdd/enemy-system.md
    variables:
      - FLUX_c                  # acting combatant's FLUX stat (1–99)
      - WINDOW_SCALE_FACTOR     # tunable float, default 1.0
      - TIMING_WINDOW_FRAMES_MAX # ceiling clamp, default 30
    output_range: [2, 30]
    expression: "max(2, min(TIMING_WINDOW_FRAMES_MAX, round(FLUX_c × WINDOW_SCALE_FACTOR)))"
    notes: "Floor of 2 frames (unreactable below). Ceiling of 30 frames (~500ms).
      Output feeds directly into Input & Timing Detection GDD and Timing Combat System."
    added: "2026-04-22"
    revised: ""

  - name: INHERITANCE_MAX
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
    variables:
      - BASE_STAT          # recipient's base stat at episode start (int)
      - INHERITANCE_CEILING # tunable float, default 0.15
    output_range: [1, 15]
    expression: "max(1, round(BASE_STAT × INHERITANCE_CEILING))"
    notes: "Floor of 1 prevents zero-magnitude inheritance objects. BASE_STAT is
      always the episode-start base, not the effective stat at moment of departure.
      Output feeds into Guest Character System GDD."
    added: "2026-04-22"
    revised: ""

  - name: BLOCK_WINDOW_FRAMES
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/input-and-timing-detection.md
      - design/gdd/enemy-system.md
    variables:
      - BLOCK_WINDOW_BASE    # base frame count, default 32
      - TEMPO_enemy          # enemy-exclusive TEMPO stat (1–99)
      - WINDOW_SCALE_FACTOR  # global accessibility scale, default 1.0
    output_range: [2, 30]
    expression: "max(2, min(30, round((BLOCK_WINDOW_BASE - TEMPO_enemy) × WINDOW_SCALE_FACTOR)))"
    notes: "Block window duration in frames. Higher enemy TEMPO → shorter block window
      (harder to block). Floor of 2 matches TIMING_WINDOW_FRAMES floor for
      consistency. Source GDD owns TEMPO; Input & Timing Detection GDD consumes
      the output as its BLOCK mode window duration."
    added: "2026-04-23"
    revised: ""

  - name: PERFECT_ZONE_SIZE
    status: active
    source: design/gdd/input-and-timing-detection.md
    referenced_by:
      - design/gdd/input-and-timing-detection.md
      - design/gdd/hud-system.md
    variables:
      - W                  # window duration (TIMING_WINDOW_FRAMES or BLOCK_WINDOW_FRAMES, 2–30)
      - PERFECT_HIT_RATIO  # fraction of window designated as Perfect zone, default 0.25
    output_range: [1, 10]
    expression: "max(1, floor(W × PERFECT_HIT_RATIO))"
    notes: "Number of trailing frames in a window that qualify for a PERFECT grade.
      Floor of 1 guarantees a non-zero Perfect zone even at minimum window size.
      At W=30 and ratio=0.35 (max): 10 frames. At W=8 and ratio=0.20 (min): 1 frame.
      Feeds into grade classification logic in Input & Timing Detection FSM."
    added: "2026-04-23"
    revised: ""

  - name: NORMALIZED_TO_DB
    status: active
    source: design/gdd/audio-system.md
    referenced_by:
      - design/gdd/audio-system.md
    variables:
      - n    # normalized volume from slider (float, [0.0, 1.0])
    output_range: [-INF, 0.0]
    expression: "-INF (if n = 0.0) / 20 × log10(n) (if n > 0.0)"
    notes: "Converts Menu & Settings System slider value to AudioServer dB.
      GDScript built-in linear_to_db(n) implements this including the -INF
      case. Inverse is db_to_linear(dB) for get_bus_volume(). Menu & Settings
      System GDD must reference this formula when specifying volume slider
      behaviour. Do not apply an epsilon floor — n=0.0 must reach true silence."
    added: "2026-04-24"
    revised: ""

  - name: STATUS_MOD
    status: active
    source: design/gdd/status-effects.md
    referenced_by:
      - design/gdd/status-effects.md
      - design/gdd/timing-combat-system.md
    variables:
      - modifier_value    # signed int per active effect entry (−30 to +30)
      - active_effects    # Array[ActiveStatusEffect] filtered by stat_affected
    output_range: [-60, 60]
    expression: "sum(modifier_value for all active effects where stat_affected == queried_stat)"
    notes: "Status modifier contribution to the effective stat formula. Returns 0 if no
      effects are active for this combatant+stat. Exposed as get_modifier(combatant_id,
      stat) in the Status Effects public API (renamed from get_stat_modifier in SE RP1,
      2026-05-02). Timing Combat System calls this before every stat-dependent calculation.
      Feeds into the effective_stat formula owned by Character Stats & Growth."
    added: "2026-04-24"
    revised: "2026-05-02"

  - name: INHERITED_TIMING_WINDOW_FRAMES
    status: active
    source: design/gdd/ability-system.md
    referenced_by:
      - design/gdd/ability-system.md
    variables:
      - FLUX_c          # using character's effective FLUX (1–99)
      - flux_offset     # signed integer from AbilityData, authored at design time (−15 to +15)
      - WINDOW_SCALE_FACTOR     # global accessibility scale (registered constant)
      - TIMING_WINDOW_FRAMES_MAX # ceiling clamp (registered constant, default 30)
    output_range: [2, 30]
    expression: "max(2, min(TIMING_WINDOW_FRAMES_MAX, round((FLUX_c + flux_offset) × WINDOW_SCALE_FACTOR)))"
    notes: "Timing window for inherited abilities. flux_offset encodes the guest's FLUX fingerprint
      relative to a representative recipient (Setsuna, FLUX=12). A negative offset narrows the window
      below the character's native FLUX; a positive offset widens it. Clamp authored flux_offset
      to ±15 to prevent degenerate windows. Feeds into Timing Combat System alongside
      TIMING_WINDOW_FRAMES (native abilities)."
    added: "2026-04-24"
    revised: ""

  - name: attack_damage
    status: active
    source: design/gdd/timing-combat-system.md
    referenced_by:
      - design/gdd/timing-combat-system.md
    variables:
      - ATK_eff   # attacker ATK after status modifiers (1–99)
      - DEF_eff   # defender DEF after status modifiers (1–99)
      - grade_multiplier  # MISS=0, HIT=1.0, PERFECT=PHM (1.2–1.6)
    output_range: [0, 147]
    expression: "MISS: 0 / Otherwise: floor(max(1, ATK_eff − DEF_eff) × grade_multiplier)"
    notes: "Primary attack damage formula. max(1, base) applies before grade_multiplier.
      floor() applies to the full product. MISS bypasses the formula entirely (0 damage).
      Practical Episode 1 range: 1–30 per hit. Depends on STATUS_MOD for effective stats."
    added: "2026-04-28"
    revised: ""

  - name: block_mitigation_hit
    status: active
    source: design/gdd/timing-combat-system.md
    referenced_by:
      - design/gdd/timing-combat-system.md
    variables:
      - full_damage  # enemy resolved damage before mitigation (int, 1–∞)
    output_range: [0, 999]
    expression: "floor(full_damage × 0.5)"
    notes: "HIT grade block mitigation. MISS block = full_damage (no formula).
      PERFECT block = 0 (no formula). Odd full_damage rounds down, party absorbs
      the extra point. Practical Episode 1 range: 0–40 per hit."
    added: "2026-04-28"
    revised: ""

  - name: HP_RATIO
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/enemy-system.md
    variables:
      - HP_current  # current HP (0 to HP_max)
      - HP_max      # maximum HP (positive integer)
    output_range: [0.0, 1.0]
    expression: "HP_current / HP_max"
    notes: "Maps to condition states: >=0.75=Unwounded, <0.75=Pressured, <0.50=Bloodied,
      <0.25=Near-Breaking, =0=Incapacitated. Enemy-only display; party HP shown as
      numeric current/max. Feeds into Enemy System and HUD System."
    added: "2026-04-22"
    revised: ""

