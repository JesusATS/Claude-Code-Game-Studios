# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: FLUX_INHERITANCE_MIN
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
    value: 2
    unit: frames (FLUX bonus from Named Inheritance Object)
    safe_range: "1 – 4 frames"
    notes: "Minimum magnitude for FLUX-targeting Named Inheritance Objects. Prevents
      sub-perceptual (1-frame) FLUX scars that players cannot detect. Established
      during character-stats-and-growth design-review (AC-23)."
    added: "2026-04-23"
    revised: ""

  - name: BLOCK_WINDOW_BASE
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/input-and-timing-detection.md
      - design/gdd/enemy-system.md
    value: 32
    unit: frames (numerator before TEMPO subtraction)
    safe_range: "24 – 40 frames"
    notes: "Base frame count in BLOCK_WINDOW_FRAMES formula before TEMPO is subtracted.
      At TEMPO=0 and WINDOW_SCALE_FACTOR=1.0, block window equals this value (clamped to 30).
      Increasing this makes blocking easier across all enemies."
    added: "2026-04-23"
    revised: ""

  - name: PERFECT_HIT_RATIO
    status: active
    source: design/gdd/input-and-timing-detection.md
    referenced_by:
      - design/gdd/input-and-timing-detection.md
      - design/gdd/hud-system.md
    value: 0.25
    unit: fraction of window (0.0–1.0)
    safe_range: "0.20 – 0.35"
    notes: "Fraction of a timing window designated as the Perfect grade zone (trailing
      frames). Used in PERFECT_ZONE_SIZE formula. Below 0.20: Ne (FLUX=8) gets a
      1-frame Perfect zone that is effectively frame-perfect. Above 0.35: 200ms+
      Perfect zones that undermine rhythmic tension."
    added: "2026-04-23"
    revised: ""

  - name: BLOCK_FORGIVENESS_FRAMES
    status: active
    source: design/gdd/input-and-timing-detection.md
    referenced_by:
      - design/gdd/input-and-timing-detection.md
    value: 1
    unit: frames post-window (grace period)
    safe_range: "0 – 2 frames"
    notes: "Post-window grace period for BLOCK mode only. Inputs within this frame
      count after BLOCK_WINDOW expires grade as HIT (not PERFECT). ACTION mode
      has no forgiveness window — misses are immediate. At 0: strict BLOCK (no
      grace). At 2: ~33ms forgiveness. Feeds into BLOCK_FORGIVENESS FSM state."
    added: "2026-04-23"
    revised: ""

  - name: SWIFT_THRESHOLD
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/enemy-system.md
      - design/gdd/timing-combat-system.md
    value: 1.5
    unit: ratio (SPD_c / SPD_min)
    safe_range: "1.2 – 3.0"
    notes: "SPD ratio required for a combatant to earn a second turn per round.
      Used in TURNS_PER_ROUND formula. Also referenced by Timing Combat System."
    added: "2026-04-22"
    revised: ""

  - name: WINDOW_SCALE_FACTOR
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/input-and-timing-detection.md
      - design/gdd/enemy-system.md
    value: 1.0
    unit: multiplier
    safe_range: "0.6 – 1.6"
    notes: "Global scale applied to FLUX when calculating TIMING_WINDOW_FRAMES.
      Primary accessibility tuning lever. Referenced by Input & Timing Detection GDD."
    added: "2026-04-22"
    revised: ""

  - name: TIMING_WINDOW_FRAMES_MAX
    status: active
    source: design/gdd/character-stats-and-growth.md
    referenced_by:
      - design/gdd/character-stats-and-growth.md
      - design/gdd/input-and-timing-detection.md
    value: 30
    unit: frames (at 60fps ≈ 500ms)
    safe_range: "20 – 45 frames"
    notes: "Ceiling clamp for TIMING_WINDOW_FRAMES. Prevents windows so wide they
      break rhythmic feel. Referenced by Input & Timing Detection GDD."
    added: "2026-04-22"
    revised: ""

  - name: MAX_CHARGE
    status: active
    source: design/gdd/timing-combat-system.md
    referenced_by:
      - design/gdd/ability-system.md
      - design/gdd/timing-combat-system.md
      - design/gdd/hud-system.md
    value: 6
    unit: CC units (integer)
    safe_range: "4 – 8"
    notes: "Combo Charge ceiling. At 6: requires 3 PERFECT attacks to fill; a 3-cost Inherited
      spend leaves 3 CC remaining, preserving optionality. Below 4 fills in 2 PERFECT attacks
      (single-round saturation). Above 8 makes CC feel inaccessible. Owned by TCS; read by
      HUD System for CC display. Updated 4→6 in TCS Revision Pass 4 (2026-04-30)."
    added: "2026-04-24"
    revised: "2026-05-02"

  - name: MAX_PARTY_SIZE
    status: active
    source: design/gdd/party-composition-manager.md
    referenced_by:
      - design/gdd/party-composition-manager.md
      - design/gdd/timing-combat-system.md
      - design/gdd/hud-system.md
