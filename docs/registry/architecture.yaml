# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: hardcoded_game_data
    status: active
    description: "Game data (character stats, ability parameters, enemy profiles, status effect values) must never be defined as GDScript constants, dictionaries, or inline literals in game code."
    why: "Hardcoded data violates coding-standards.md ('Gameplay values must be data-driven'), prevents Inspector authoring, and requires code edits for balance tuning."
    adr: docs/architecture/adr-0001-data-driven-resource-registry.md
    added: 2026-05-04

  - pattern: json_file_access_for_structured_data
    status: active
    description: "Structured game data (schemas with typed fields) must not be stored as JSON files and loaded via FileAccess."
    why: "JSON/FileAccess provides no Inspector authoring, no typed arrays, requires manual type coercion, and adds FileAccess.store_* bool-return error-check boilerplate (Godot 4.4+). Resource subclasses cover all required use cases without these costs."
    adr: docs/architecture/adr-0001-data-driven-resource-registry.md
    added: 2026-05-04

  - pattern: direct_autoload_access_in_leaf_systems
    status: active
    description: "Game code outside designated composition root files must not call get_node('/root/AutoloadName') or reference Autoload global names directly."
    why: "Direct Autoload access in leaf systems (AbilitySystem, StatusEffects, TCS, etc.) makes them untestable in isolation — unit tests cannot inject mocks. Only composition roots (scene root nodes) are permitted to retrieve Autoload references and inject them downward."
    adr: docs/architecture/adr-0002-autoload-singleton-strategy.md
    added: 2026-05-04

  - pattern: timing_confirm_aliased_to_ui_accept
    status: active
    description: "timing_confirm must not be set as an alias or duplicate of ui_accept in InputMap. They may share the same physical key/button but must be separate logical actions."
    why: "If timing_confirm is bound to ui_accept, any focused Control that handles ui_accept will consume the timing event before ITD can process it, causing missed timing grades."
    adr: docs/architecture/adr-0003-input-routing-dual-focus.md
    added: 2026-05-04

  - pattern: hud_input_active_during_timing_window
    status: active
    description: "HUD Control subtree must have set_process_input(false) active for the duration of every ITD timing window. BattleSceneRoot composition root is responsible for this wiring."
    why: "Any HUD Control with keyboard focus during a timing window could consume the timing_confirm event, silently dropping a player's timed input. Defense in depth beyond action separation."
    adr: docs/architecture/adr-0003-input-routing-dual-focus.md
    added: 2026-05-04

  - pattern: persistent_system_direct_battle_scene_subscription
    status: active
    description: "Persistent systems (HUDSystem, AudioSystem) must NOT connect directly to signals on TCS, StatusEffects, or any other battle-scoped scene node."
    why: "Battle-scoped nodes are freed at battle end. A persistent system holding a direct connection creates a dangling reference or requires explicit disconnect code every battle. CombatEventBus (ADR-0004) solves this cleanly — persistent systems subscribe to the bus once."
    adr: docs/architecture/adr-0004-combat-event-signal-bus.md
    added: 2026-05-04

  - pattern: inner_class_refcounted_with_class_name
    status: active
    description: "class_name X extends RefCounted must not be declared on an inner class (a class defined inside another .gd file). Only standalone .gd files may carry class_name declarations for RefCounted subclasses."
    why: "Inner-class class_name declarations do not enable typed array inference (Array[InnerClass] fails static analysis in Godot 4.x). All typed collection support requires standalone file class_name."
    adr: docs/architecture/adr-0005-refcounted-class-naming-typed-collections.md
    added: 2026-05-04

  - pattern: enemy_hp_stored_outside_tcs
    status: active
    description: "Enemy current HP during combat must not be stored on EnemyData resources, in EnemySystem, or in any system other than TimingCombatSystem. TCS owns _enemy_hp: Dictionary[int, int] for the encounter lifetime."
    why: "EnemyData is a read-only Resource (ADR-0001). EnemySystem is stateless. Placing mutable HP elsewhere creates dual-write risk or requires a separate HP query API. TCS-owned HP is cleared at ENCOUNTER_END with no lifecycle management burden on other systems."
    adr: docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04

  - pattern: coroutine_based_tcs_state_machine
    status: active
    description: "TimingCombatSystem must not implement its state machine as a coroutine chain (no await itd.input_result or await hud.action_selected as the primary flow control mechanism)."
    why: "Coroutine-based FSM cannot be interrupted by force_close_window() without fragile coroutine lifecycle management. Signal-driven FSM with CONNECT_ONE_SHOT resolves this cleanly and enables per-frame GUT state inspection."
    adr: docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04

  - pattern: canvaslayer_direct_modulate
    status: active
    description: "No HUD element may be a direct child of a CanvasLayer node. Every CanvasLayer must have a Node2D as its sole direct child ('container'). All HUD elements are children of that Node2D. Tween targets for modulate are the Node2D containers — never the CanvasLayer nodes themselves."
    why: "CanvasLayer extends Node (not CanvasItem) in Godot 4.x — it has no modulate property. Tweening a CanvasLayer's modulate silently fails (no error, no visual effect). The Node2D container pattern is the only way to give CanvasLayer children modulate-based warm/cool palette participation."
    adr: docs/architecture/adr-0014-hud-canvaslayer-structure.md
    added: 2026-05-04

  - pattern: timing_bar_tick_driven_animation
    status: active
    description: "TimingBar cursor width must NOT be driven by ITD window_frame_tick signals. Width must be computed in _process() via elapsed real-time delta accumulation and Formula H1."
    why: "At minimum window size W=2 (window_duration_seconds ≈ 0.033s), only 0–1 ITD ticks arrive before window close. Tick-driven animation at this scale produces a visually frozen bar. _process() at render rate (~60fps) provides 2 width samples even at W=2, ensuring smooth visual depletion."
    adr: docs/architecture/adr-0014-hud-canvaslayer-structure.md
    added: 2026-05-04

  - pattern: pcm_not_initialized_query
    status: active
    description: "No method on PartyCompositionManager may return data before is_initialized() returns true. Any call that arrives before initialize() must push_error() and return a safe default (empty array, null, 0)."
    why: "PCM is Autoload position 6 — it has no data until the game scene calls initialize(). Callers in other Autoloads (positions 1-5) or early _ready() calls may execute before initialization. The guard prevents silent null reads."
    adr: docs/architecture/adr-0010-party-slot-model.md
    added: 2026-05-04

  - pattern: party_snapshot_int_keys
    status: active
    description: "get_party_snapshot() must return Dictionary with String keys '1'-'4', never int keys 1-4."
    why: "JSON round-trips (save/load, telemetry) coerce Dictionary int keys to String automatically on serialize but not on deserialize — the deserialized dict has String keys regardless. Using String keys from the start prevents key-type mismatch bugs in save data."
    adr: docs/architecture/adr-0010-party-slot-model.md
    added: 2026-05-04

  - pattern: deferred_ability_resolved_connection
    status: active
    description: "StatusEffects must not connect to AbilitySystem.ability_resolved with CONNECT_DEFERRED. The connection must use CONNECT_DEFAULT (synchronous)."
    why: "CONNECT_DEFERRED defers SE handler to the next frame. TCS reads effective stats in the same frame as ability dispatch — a deferred connection causes TCS to read stale modifier values and compute incorrect damage for abilities that self-apply debuffs."
    adr: docs/architecture/adr-0009-status-effect-application-contract.md
    added: 2026-05-04

