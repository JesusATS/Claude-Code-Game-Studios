# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: game_data_schema_format
    status: active
    api: "Resource subclass with @export fields in standalone .gd file with class_name"
    not: "GDScript Dictionary, JSON/FileAccess, inner class Resource"
    adr: docs/architecture/adr-0001-data-driven-resource-registry.md
    reason: "Inspector authoring, typed arrays, .tres deserialization, and static analysis all require standalone class_name declarations on Resource subclasses"
    referenced_by:
      - docs/architecture/adr-0001-data-driven-resource-registry.md
    added: 2026-05-04
    revised: ""

  - purpose: autoload_qualification
    status: active
    api: "3-rule criterion: (1) state survives scene changes, (2) 3+ unrelated consumers, (3) no scene-specific node dependency"
    not: "ad-hoc Autoload promotion; Autoloads for combat-scope or encounter-scope systems"
    adr: docs/architecture/adr-0002-autoload-singleton-strategy.md
    reason: "Prevents global singleton sprawl; enforces testability by keeping the Autoload surface minimal and explicit"
    referenced_by:
      - docs/architecture/adr-0002-autoload-singleton-strategy.md
    added: 2026-05-04
    revised: ""

  - purpose: timing_confirm_action_mapping
    status: active
    api: "timing_confirm is a standalone InputMap action. Keys: [Space]. Joypad: [JOY_BUTTON_A]. NOT aliased to ui_accept or any ui_* action."
    not: "timing_confirm bound to ui_accept; any sharing of logical action identity between timing_confirm and ui_* actions"
    adr: docs/architecture/adr-0003-input-routing-dual-focus.md
    reason: "Prevents HUD Controls from consuming timing_confirm events under ui_accept during combat timing windows"
    referenced_by:
      - docs/architecture/adr-0003-input-routing-dual-focus.md
    added: 2026-05-04
    revised: ""

  - purpose: refcounted_class_placement
    status: active
    api: "All class_name X extends RefCounted declarations must be in standalone .gd files (not inner classes). File named after class in snake_case. Co-located in owning system directory."
    not: "inner class RefCounted with class_name; anonymous RefCounted subclasses in typed arrays"
    adr: docs/architecture/adr-0005-refcounted-class-naming-typed-collections.md
    reason: "Inner-class class_name does not enable typed array type inference in Godot 4.x. Mirrors ADR-0001 rule for Resource subclasses."
    referenced_by:
      - docs/architecture/adr-0005-refcounted-class-naming-typed-collections.md
    added: 2026-05-04
    revised: ""

  - purpose: typed_collections_in_public_api
    status: active
    api: "All public method signatures and class properties must use typed collections: Array[T] and Dictionary[K, V]. No raw Array or Dictionary in public interfaces."
    not: "untyped Array or Dictionary in any public method signature or class property"
    adr: docs/architecture/adr-0005-refcounted-class-naming-typed-collections.md
    reason: "Static analysis and autocomplete require typed collections. Dictionary[K,V] available since Godot 4.4, confirmed in 4.6."
    referenced_by:
      - docs/architecture/adr-0005-refcounted-class-naming-typed-collections.md
    added: 2026-05-04
    revised: ""

  - purpose: combat_fsm_implementation_pattern
    status: active
    api: "Signal-driven FSM using CONNECT_ONE_SHOT for external input waits (timing window, block window). No coroutine-based await chains for TCS state transitions."
    not: "await-based coroutine chain for TCS state machine; storing coroutine references to cancel mid-await"
    adr: docs/architecture/adr-0006-combat-state-machine.md
    reason: "CONNECT_ONE_SHOT enables force_close_window() to interrupt any pending window without coroutine lifecycle management. Signal-driven state allows per-frame GUT assertions on _state."
    referenced_by:
      - docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04
    revised: ""

  - purpose: combatant_id_type_at_bus_boundary
    status: active
    api: "TCS signals use int combatant_id. BattleSceneRoot relay converts int → StringName via str(id) before calling CombatEventBus relay methods. CombatEventBus signals use StringName (ADR-0004)."
    not: "TCS emitting StringName combatant_id directly; storing StringName ids internally in TCS or SE"
    adr: docs/architecture/adr-0006-combat-state-machine.md
    reason: "int is simpler for arithmetic and dictionary keys inside TCS. StringName on the bus matches ADR-0004's signal contracts. The relay boundary is the single conversion point."
    referenced_by:
      - docs/architecture/adr-0006-combat-state-machine.md
      - docs/architecture/adr-0004-combat-event-signal-bus.md
    added: 2026-05-04
    revised: ""

  - purpose: ability_system_id_type
    status: active
    api: "AbilitySystem public API uses StringName character_id (CharacterData.id, e.g. &'clawd'). TCS maintains _instance_to_char_id: Dictionary[int, StringName] at ENCOUNTER_START to bridge int instance_ids to AS calls."
    not: "AbilitySystem using int instance_id; TCS passing raw int to AS methods"
    adr: docs/architecture/adr-0009-status-effect-application-contract.md
    reason: "AS persistent state (InheritedAbilityUnlockRecord, combo_states) is keyed by permanent character identity, not encounter-scope instance_id. StringName character_id is consistent across encounters."
    referenced_by:
      - docs/architecture/adr-0009-status-effect-application-contract.md
    added: 2026-05-04
    revised: ""

  - purpose: status_effects_id_type
    status: active
    api: "StatusEffects public API uses int instance_id (same convention as TCS internals, ADR-0006). SE signals emit int; BattleSceneRoot relay converts to StringName for CombatEventBus."
    not: "StatusEffects using StringName combatant_id internally; SE signals emitting StringName directly"
    adr: docs/architecture/adr-0009-status-effect-application-contract.md
    reason: "SE is purely encounter-scoped. int instance_id matches TCS calling convention — no per-call conversion needed for high-frequency get_modifier() calls."
    referenced_by:
      - docs/architecture/adr-0009-status-effect-application-contract.md
    added: 2026-05-04
    revised: ""

  - purpose: ability_resolved_connection_mode
    status: active
    api: "SE connects to AS.ability_resolved with CONNECT_DEFAULT (synchronous). SE handler fires inside resolve_ability() before it returns. SE modifiers are visible to TCS stat reads in the same resolution frame."
    not: "CONNECT_DEFERRED for ability_resolved; any pattern that defers SE modifier application to the next frame"
    adr: docs/architecture/adr-0009-status-effect-application-contract.md
    reason: "GDD same-frame visibility guarantee: effect modifiers applied by ability_resolved must be visible to get_modifier() within the same resolve_ability() call. Deferred connection silently breaks authored ability behavior."
    referenced_by:
      - docs/architecture/adr-0009-status-effect-application-contract.md
    added: 2026-05-04
    revised: ""

  - purpose: inherited_ability_unlock_write_path
    status: active
    api: "AbilitySystem.unlock_inherited_ability(char_id, ability_id, guest_id, chapter). Idempotent. Validates ability_id and category='INHERITED' before writing. ability_list_changed emission buffered via _encounter_active flag — fires immediately between encounters, deferred to on_encounter_ended() during combat."
    not: "Guest Character System writing _unlock_records directly; ability_list_changed firing mid-combat; unlock records stored in GCS"
    adr: docs/architecture/adr-0016-inherited-ability-guest-departure.md
    reason: "AbilitySystem is the sole owner of unlock state (GDD explicit). Mid-combat emission would require HUD to rebuild ability menus during a live turn — undefined under ADR-0014. Idempotency prevents double-registration on scene reloads."
    referenced_by:
      - docs/architecture/adr-0016-inherited-ability-guest-departure.md
    added: 2026-05-04
    revised: ""

  - purpose: scan_resolved_signal_routing
    status: active
    api: "AS emits scan_resolved(target_instance_id: int). BattleSceneRoot wires it to: (1) tcs._on_scan_resolved() [direct] and (2) bus.relay_scan_resolved() [CombatEventBus, 14th signal]. int→StringName conversion at bus boundary per ADR-0006 convention."
    not: "HUD subscribing directly to AS.scan_resolved; TCS querying EnemyData for scan state; scan unlock flag stored outside TCS"
    adr: docs/architecture/adr-0015-enemy-condition-evaluation.md
    reason: "Consistent with ADR-0004's relay pattern. TCS must set _scan_unlocked before HUD reads get_exact_hp() — direct wiring guarantees ordering; bus relay delivers to HUD."
    referenced_by:
      - docs/architecture/adr-0015-enemy-condition-evaluation.md
      - docs/architecture/adr-0004-combat-event-signal-bus.md
    added: 2026-05-04
    revised: ""

  - purpose: multi_hit_fsm_pattern
    status: active
    api: "Multi-hit abilities use _pending_hits_remaining counter on TCS. BLOCK_RESOLVE checks counter: if > 0 → transition to BLOCK_WINDOW (next hit); else → TURN_END. Each BLOCK_WINDOW opens fresh ITD timing window. No coroutines."
    not: "Coroutine loop in ENEMY_ACTION iterating through hits with await; polling _process() to chain windows; storing hit results mid-sequence outside TCS"
    adr: docs/architecture/adr-0015-enemy-condition-evaluation.md
    reason: "Extends signal-driven FSM (ADR-0006) without introducing coroutines. force_close_window() works identically for single and multi-hit paths."
    referenced_by:
      - docs/architecture/adr-0015-enemy-condition-evaluation.md
    added: 2026-05-04
    revised: ""

  - purpose: hud_canvaslayer_assignment
    status: active
    api: "Layer 10: main HUD (turn strip, HP bars, CC bar, enemy panels, timing bar, action menu). Layer 11: grade flash overlay. Layer 12: encounter result text. Layers ≥ 20: non-HUD overlays (pause, dialogue, scene transitions)."
    not: "HUD elements on layers outside 10–12; non-HUD overlays on layers 10–19"
    adr: docs/architecture/adr-0014-hud-canvaslayer-structure.md
    reason: "Fixed layer assignments prevent z-ordering conflicts between grade flash and HUD elements and between HUD overlays and scene transitions."
    referenced_by:
      - docs/architecture/adr-0014-hud-canvaslayer-structure.md
    added: 2026-05-04
    revised: ""

  - purpose: timing_bar_animation_model
    status: active
    api: "TimingBar._process() accumulates delta into _elapsed_seconds. Cursor width = BAR_PIXEL_WIDTH * (1 - elapsed/duration). PERFECT flash uses 2× await get_tree().process_frame coroutine. Window frames clamped to minimum 2 with push_error()."
    not: "Tick-driven animation via window_frame_tick signal; Timer nodes for PERFECT flash delay; polling _process() frame counter for PERFECT flash"
    adr: docs/architecture/adr-0014-hud-canvaslayer-structure.md
    reason: "Real-time delta ensures smooth animation at minimum window sizes (W=2). Coroutine-based PERFECT flash is explicitly specified by GDD VA-2.4 — frame boundary alignment guaranteed."
    referenced_by:
      - docs/architecture/adr-0014-hud-canvaslayer-structure.md
    added: 2026-05-04
    revised: ""

  - purpose: pcm_autoload_position
    status: active
    api: "PartyCompositionManager is Autoload position 6 (amends ADR-0002). Accessed via injection — composition roots call get_node('/root/PartyCompositionManager') and inject the reference; leaf systems never reference it directly (per forbidden_pattern: direct_autoload_access_in_leaf_systems)."
    not: "PCM as a scene-local node; PCM accessed directly by TCS/AS/SE without injection"
    adr: docs/architecture/adr-0010-party-slot-model.md
    reason: "PCM qualifies under 3-rule criterion: party state survives scene changes; 5+ unrelated consumers (TCS, HUD, AudioSystem, StoryState, SaveSystem); no scene-specific node dependency."
    referenced_by:
      - docs/architecture/adr-0010-party-slot-model.md
      - docs/architecture/adr-0002-autoload-singleton-strategy.md
    added: 2026-05-04
    revised: ""

  - purpose: max_party_size_constant
    status: active
    api: "PartyCompositionManager.MAX_PARTY_SIZE: int = 4 is the single source of truth for the party size limit. All consumers reference this constant — never hardcode literal 4."
    not: "Hardcoded literal 4 in any file other than the PCM constant declaration itself"
    adr: docs/architecture/adr-0010-party-slot-model.md
    reason: "Single constant prevents silent divergence if party size changes (e.g., expansion to 5-member party). MAX_PARTY_SIZE on the class is accessible to all consumers without importing a separate constants file."
    referenced_by:
      - docs/architecture/adr-0010-party-slot-model.md
    added: 2026-05-04
    revised: ""

  - purpose: effective_flux_floor_enforcement
    status: active
    api: "CharacterStatsUtil.effective_flux(base, inheritance_sum, status_modifier_sum) -> int applies EFFECTIVE_FLUX_FLOOR=8 as the minimum clamp. TCS calls this method for FLUX only; all other stats use effective_stat() with floor=1."
    not: "Applying EFFECTIVE_FLUX_FLOOR in ITD, in TCS ad-hoc, or duplicated across multiple call sites"
    adr: docs/architecture/adr-0009-status-effect-application-contract.md
    reason: "Single enforcement site in CharacterStatsUtil co-locates the FLUX floor rule with the FLUX-to-frames conversion path. No drift risk from dual enforcement."
    referenced_by:
      - docs/architecture/adr-0009-status-effect-application-contract.md
      - docs/architecture/adr-0007-effective-stat-computation.md
    added: 2026-05-04
    revised: ""

