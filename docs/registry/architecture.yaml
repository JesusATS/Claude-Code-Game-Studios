# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: game_data_lookup
    status: active
    pattern: direct_call
    producer: ResourceRegistry
    consumers:
      - TimingCombatSystem    # reads AbilityData.timing_window_frames at turn start
      - AbilitySystem         # reads AbilityData at ability resolution
      - EnemyRegistry         # reads EnemyData at enemy spawn
      - PartyCompositionManager  # reads CharacterData at party load
      - StatusEffects         # reads StatusEffectData at effect application
      - AudioSystem           # reads sfx_id fields for sound events
      - HUDSystem             # reads CharacterData for stat display
    adr: docs/architecture/adr-0001-data-driven-resource-registry.md
    signal_signature: "get_*(id: StringName) -> [Type]Data  |  get_*_copy(id: StringName) -> [Type]Data"
    referenced_by:
      - docs/architecture/adr-0001-data-driven-resource-registry.md
    added: 2026-05-04
    revised: ""

  - contract: autoload_reference_injection
    status: active
    pattern: direct_call
    producer: SceneRoot (composition root nodes)
    consumers:
      - all scene-local systems that need Autoload services
    adr: docs/architecture/adr-0002-autoload-singleton-strategy.md
    signal_signature: "initialize(registry: ResourceRegistry, story_state: StoryState) — composition root calls get_node('/root/X') once and injects into children"
    referenced_by:
      - docs/architecture/adr-0002-autoload-singleton-strategy.md
    added: 2026-05-04
    revised: ""

  - contract: itd_window_hud_gating
    status: active
    pattern: signal
    producer: InputTimingDetector
    consumers:
      - BattleSceneRoot (composition root)  # connects to HUD disable/enable
    adr: docs/architecture/adr-0003-input-routing-dual-focus.md
    signal_signature: "window_opened(mode: StringName) → _hud_root.set_process_input(false); window_closed(grade: StringName) → _hud_root.set_process_input(true)"
    referenced_by:
      - docs/architecture/adr-0003-input-routing-dual-focus.md
    added: 2026-05-04
    revised: ""

  - contract: combat_event_bus_relay
    status: active
    pattern: event_bus
    producer: "TimingCombatSystem (TCS), StatusEffects (SE) — via relay methods"
    consumers:
      - HUDSystem    # subscribes to bus at _ready(); persistent
      - AudioSystem  # subscribes to bus at _ready(); persistent
    adr: docs/architecture/adr-0004-combat-event-signal-bus.md
    signal_signature: "CombatEventBus Autoload — relay pattern: BattleSceneRoot connects tcs.signal → bus.relay_*(). HUD/Audio subscribe bus.signal → handler."
    referenced_by:
      - docs/architecture/adr-0004-combat-event-signal-bus.md
    added: 2026-05-04
    revised: ""

