# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: ""

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: game_data_registry
    status: active
    owner_system: ResourceRegistry
    adr: docs/architecture/adr-0001-data-driven-resource-registry.md
    interface: "ResourceRegistry.get_character(id), get_ability(id), get_status_effect(id), get_enemy(id) — read-only; get_*_copy(id) for mutable encounter copies"
    write_access: ResourceRegistry-only   # loaded once at startup, read-only at runtime
    referenced_by:
      - docs/architecture/adr-0001-data-driven-resource-registry.md
    added: 2026-05-04
    revised: ""

  - state: autoload_singleton_set
    status: active
    owner_system: ProjectSettings (Autoload tab)
    adr: docs/architecture/adr-0002-autoload-singleton-strategy.md
    interface: "6 confirmed Autoloads in load order: StoryState(1), ResourceRegistry(2), DialogueManager(3), SceneManager(4), CombatEventBus(5), PartyCompositionManager(6). ADR-0010 added position 6."
    write_access: ADR-0002 only — any addition to the Autoload list must pass 3-rule criterion and update ADR-0002
    referenced_by:
      - docs/architecture/adr-0002-autoload-singleton-strategy.md
      - docs/architecture/adr-0004-combat-event-signal-bus.md
      - docs/architecture/adr-0010-party-slot-model.md

  - state: combat_event_routing
    status: active
    owner_system: CombatEventBus
    adr: docs/architecture/adr-0004-combat-event-signal-bus.md
    interface: "CombatEventBus Autoload — 13 signals (encounter_started, encounter_ended, turn_started, turn_ended, damage_dealt, combatant_incapacitated, hp_danger_zone_entered, enemy_condition_changed, hp_changed, status_effect_applied, status_effect_expired, status_effect_tick, ability_list_changed)"
    write_access: "TCS and SE feed events into bus via relay methods; BattleSceneRoot wires the connections; no system emits directly onto the bus"
    referenced_by:
      - docs/architecture/adr-0004-combat-event-signal-bus.md
      - docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04
    revised: ""

  - state: enemy_hp_during_combat
    status: active
    owner_system: TimingCombatSystem
    adr: docs/architecture/adr-0006-combat-state-machine.md
    interface: "TCS._enemy_hp: Dictionary[int, int] — instance_id → current_hp. Read-only for all other systems. Populated at ENCOUNTER_START from EnemyData.hp_max. Discarded at ENCOUNTER_END."
    write_access: "TCS-only. EnemySystem and StatusEffects read HP via encounter_state snapshot constructed by TCS."
    referenced_by:
      - docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04
    revised: ""

  - state: party_slot_registry
    status: active
    owner_system: PartyCompositionManager
    adr: docs/architecture/adr-0010-party-slot-model.md
    interface: "PCM.get_active_combatants() -> Array[CharacterData] (shallow copy, non-null slots only). PCM.get_slot(slot_index: int) -> CharacterData (1-indexed). PCM.is_initialized() -> bool (guard before any query). PCM.get_party_snapshot() -> Dictionary (String keys '1'-'4')."
    write_access: "PCM-only. Slots mutated only via initialize(), register_guest(), deregister_guest(). All callers receive copies or read-only references."
    referenced_by:
      - docs/architecture/adr-0010-party-slot-model.md
      - docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04
    revised: ""

  - state: inherited_ability_unlock_records
    status: active
    owner_system: AbilitySystem
    adr: docs/architecture/adr-0016-inherited-ability-guest-departure.md
    interface: "AbilitySystem.unlock_inherited_ability(receiving_char_id, ability_id, source_guest_id, chapter) — write path. AbilitySystem.get_combatant_abilities(combatant_id) — read path (includes unlocked inherited abilities). serialize_unlock_records() / deserialize_unlock_records() — Save System integration."
    write_access: "AbilitySystem-only via unlock_inherited_ability(). Guest Character System calls this method — never writes _unlock_records directly."
    referenced_by:
      - docs/architecture/adr-0016-inherited-ability-guest-departure.md
    added: 2026-05-04
    revised: ""

  - state: enemy_condition_state_cache
    status: active
    owner_system: TimingCombatSystem
    adr: docs/architecture/adr-0015-enemy-condition-evaluation.md
    interface: "TCS._enemy_condition_states: Dictionary[int, StringName] — internal cache only. Consumers receive state changes via enemy_condition_changed signal (CombatEventBus). No external get_condition_state() method is exposed."
    write_access: "TCS-only. Written by _check_condition_transition() called after every HP mutation."
    referenced_by:
      - docs/architecture/adr-0015-enemy-condition-evaluation.md
    added: 2026-05-04
    revised: ""

  - state: enemy_scan_unlock_flags
    status: active
    owner_system: TimingCombatSystem
    adr: docs/architecture/adr-0015-enemy-condition-evaluation.md
    interface: "TCS.get_exact_hp(instance_id: int) -> int — public method. Returns -1 with push_error() if scan not yet resolved. Scan unlocked by AS.scan_resolved signal relayed via BattleSceneRoot."
    write_access: "TCS-only via _on_scan_resolved(). AS emits the trigger; TCS sets the flag."
    referenced_by:
      - docs/architecture/adr-0015-enemy-condition-evaluation.md
    added: 2026-05-04
    revised: ""

  - state: combatant_instance_id_namespace
    status: active
    owner_system: TimingCombatSystem
    adr: docs/architecture/adr-0006-combat-state-machine.md
    interface: "int instance_id. Party: slot index 1-4 (1-based, matching PCM). Enemies: 101 + encounter_slot (1-based). BattleSceneRoot relay converts int → str(id) StringName at CombatEventBus boundary."
    write_access: "TCS assigns IDs at ENCOUNTER_START. IDs are stable for the encounter lifetime and not reused if a combatant is INCAPACITATED."
    referenced_by:
      - docs/architecture/adr-0006-combat-state-machine.md
    added: 2026-05-04
    revised: ""

